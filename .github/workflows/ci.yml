name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server — types + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand --forceExit
        env:
          # Tests force the in-memory store; no PostgreSQL service needed.
          AI_ENABLED: 'false'
          NODE_ENV: test

  mobile:
    name: mobile — types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  web:
    name: web — types (tracking)
    runs-on: ubuntu-latest
    # TODO: remove continue-on-error once the pre-existing TypeScript errors in
    # web/app/page.tsx, web/app/providers/page.tsx, web/components/Chat.tsx and
    # web/components/MessageBubble.tsx are fixed. Tracked in tasks/todo.md.
    continue-on-error: true
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  migrations:
    name: migrations — fresh database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: everyday
          POSTGRES_PASSWORD: everyday
          POSTGRES_DB: everyday_ai
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations on a clean database
        env:
          PGPASSWORD: everyday
        run: |
          psql -h 127.0.0.1 -U everyday -d everyday_ai -v ON_ERROR_STOP=1 -f migrations/001_initial.sql
          psql -h 127.0.0.1 -U everyday -d everyday_ai -v ON_ERROR_STOP=1 -f migrations/002_universal_platform.sql
      - name: Re-apply 002 to prove idempotency
        env:
          PGPASSWORD: everyday
        run: psql -h 127.0.0.1 -U everyday -d everyday_ai -v ON_ERROR_STOP=1 -f migrations/002_universal_platform.sql
